name: Deploy

on:
  workflow_dispatch:
    inputs:
      bot:
        description: Bot implementation to deploy
        required: true
        default: python
        type: choice
        options:
          - python
          - typescript
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    env:
      BOT_IMPLEMENTATION: ${{ inputs.bot || 'python' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare environment file
        env:
          MORSEL_API_KEY: ${{ secrets.MORSEL_API_KEY }}
          TELEGRAM_INSTANT_VIEW_RHASH: ${{ vars.TELEGRAM_INSTANT_VIEW_RHASH }}
        run: |
          install -m 600 /dev/null .env
          {
            echo "BOT_TOKEN=${{secrets.BOT_TOKEN}}"
            echo "BOT_WHITELIST=${{vars.BOT_WHITELIST}}"
            echo "OPENAI_BASE_URL=${{vars.OPENAI_BASE_URL}}"
            echo "OPENAI_API_KEY=${{secrets.OPENAI_API_KEY}}"
            echo "OPENAI_MODEL=${{vars.OPENAI_MODEL}}"
            echo "LOGFIRE_TOKEN=${{secrets.LOGFIRE_TOKEN}}"
            echo "LOGFIRE_ENVIRONMENT=${{vars.LOGFIRE_ENVIRONMENT}}"
            echo "FIRECRAWL_API_KEY=${{secrets.FIRECRAWL_API_KEY}}"
            printf 'MORSEL_API_KEY=%s\n' "$MORSEL_API_KEY"
            printf 'TELEGRAM_INSTANT_VIEW_RHASH=%s\n' "$TELEGRAM_INSTANT_VIEW_RHASH"
          } >> .env

      - name: Deploy with Docker Compose
        run: |
          case "$BOT_IMPLEMENTATION" in
            python)
              docker compose build
              docker compose -f apps/telegram-agent-typescript/docker-compose.yml down --remove-orphans
              docker compose up -d --no-build --remove-orphans
              ;;
            typescript)
              docker compose -f apps/telegram-agent-typescript/docker-compose.yml build
              docker compose down --remove-orphans
              docker compose -f apps/telegram-agent-typescript/docker-compose.yml up -d --no-build --remove-orphans
              ;;
            *)
              echo "Unsupported bot implementation: $BOT_IMPLEMENTATION" >&2
              exit 1
              ;;
          esac
          docker image prune -f

      - name: Remove environment file
        if: always()
        run: rm -f .env
