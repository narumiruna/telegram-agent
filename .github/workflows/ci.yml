name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check --workspace telegramagent-typescript
      - name: Lint
        run: npm run lint --workspace telegramagent-typescript
      - name: Type check
        run: npm run typecheck --workspace telegramagent-typescript
      - name: Test
        run: npm test --workspace telegramagent-typescript
      - name: Build
        run: npm run build --workspace telegramagent-typescript
